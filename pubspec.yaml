name: Koinos
description: "Koinos: Real-Time Collaborative Task Tracker"

publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  go_router: ^17.1.0

  flutter_bloc: ^9.1.1

  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  firebase_database: ^12.1.4

  flutter_animate: ^4.5.2

  permission_handler: ^12.0.1
  google_sign_in: ^6.2.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  image_picker: ^1.2.2
  dio: ^5.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
  macos:
    generate: true
    image_path: "assets/icon/icon.png"
  web:
    generate: true
    image_path: "assets/icon/icon.png"

flutter_native_splash:
  color: "#5C62F2"
  fullscreen: true
  android: true
  ios: true
  android_12:
    color: "#5C62F2"
    fullscreen: true

